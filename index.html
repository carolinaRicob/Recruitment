<style>
/* Layout: app shell del Design System IntegraIT (menú lateral navy + contenido claro), launcher tipo M365 en el portal. */
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --surface-2:#F2F2F2; --line:#EBEBEB; --line-2:#D8D8D8;
  --fg:#1F2937; --muted:#6B7280; --faint:#969696;
  --teal:#1F6872; --cyan:#098392; --cta:#007B97; --cta-hover:#00718A; --blue:#0EA7BB; --sky:#7DC9D8;
  --mint:#B8E9CD; --sage:#90DABB; --aqua:#40B9B2; --tint:#E8FCFF;
  --nav:#072F3E; --nav-fg:#FFFFFF; --nav-active:#0E6F7D; --nav-accent:#4BCF9E;
  --ok:#00A779; --ok-bg:#E3F7EF; --warn:#B86A00; --warn-bg:#FFF2DC; --crit:#C9302B; --crit-bg:#FCE8E7; --info-bg:#E8FCFF;
  --pend:#EA5B13; --pend-bg:#FFF1E8;
  --shadow:0 1px 2px rgba(7,47,62,.06),0 4px 16px rgba(7,47,62,.06);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ui:"Nunito Sans","Inter",system-ui,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1E1E; --surface:#2A2A2A; --surface-2:#252525; --line:#3A3A3A; --line-2:#4A4A4A;
  --fg:#E8E8E8; --muted:#A3A3A3; --faint:#7A7A7A;
  --teal:#7DC9D8; --cyan:#40B9B2; --cta:#B8E9CD; --cta-hover:#90DABB; --tint:#24363A;
  --nav:#252525; --nav-fg:#D6D6D6; --nav-active:#B8E9CD; --nav-accent:#B8E9CD;
  --ok:#3FD3A6; --ok-bg:#1F3A31; --warn:#F6C453; --warn-bg:#3A3220; --crit:#FF7B75; --crit-bg:#3E2423; --info-bg:#24363A;
  --pend:#FF9A5C; --pend-bg:#3B2A20; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1E1E1E; --surface:#2A2A2A; --surface-2:#252525; --line:#3A3A3A; --line-2:#4A4A4A;
  --fg:#E8E8E8; --muted:#A3A3A3; --faint:#7A7A7A;
  --teal:#7DC9D8; --cyan:#40B9B2; --cta:#B8E9CD; --cta-hover:#90DABB; --tint:#24363A;
  --nav:#252525; --nav-fg:#D6D6D6; --nav-active:#B8E9CD; --nav-accent:#B8E9CD;
  --ok:#3FD3A6; --ok-bg:#1F3A31; --warn:#F6C453; --warn-bg:#3A3220; --crit:#FF7B75; --crit-bg:#3E2423; --info-bg:#24363A;
  --pend:#FF9A5C; --pend-bg:#3B2A20; --shadow:none; color-scheme:dark;
}
:root{--on-cta:#FFFFFF; --nav-active-fg:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--on-cta:#123C42; --nav-active-fg:#1F6872}}
:root[data-theme="dark"]{--on-cta:#123C42; --nav-active-fg:#1F6872}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Botones (Botones / CTA del DS: 44px alto, radio 8, Inter Semi Bold) */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:14px;background:transparent;white-space:nowrap}
.btn-primary{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
.btn-primary:hover{background:var(--cta-hover)}
.btn-secondary{border-color:var(--cta);color:var(--cta);background:var(--surface)}
.btn-secondary:hover{background:var(--tint)}
.btn-tertiary{color:var(--fg)}
.btn-tertiary:hover{background:var(--surface-2)}
.btn[disabled]{background:var(--line);color:var(--muted);border-color:var(--line);cursor:not-allowed}
.btn-icon{width:40px;padding:0;justify-content:center;color:var(--muted)}
.btn-icon:hover{background:var(--surface-2);color:var(--fg)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}

/* Chips de anotación */
.tag{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--f-body);letter-spacing:.02em;padding:4px 8px;border-radius:99px;white-space:nowrap}
.tag-hu{background:var(--ok-bg);color:var(--ok)}
.tag-pend{background:var(--pend-bg);color:var(--pend)}
.tag-lock{background:var(--surface-2);color:var(--muted)}
body.no-annot .tag-hu, body.no-annot .tag-pend.annot{display:none}
.pend-outline{outline:1.5px dashed var(--pend);outline-offset:3px}
body.no-annot .pend-outline{outline:none}

/* Estados */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-abierto{background:var(--info-bg);color:var(--cyan)}
.st-proceso{background:var(--warn-bg);color:var(--warn)}
.st-cerrada{background:var(--ok-bg);color:var(--ok)}
.crit-critica{color:var(--crit)} .crit-mayor{color:var(--warn)} .crit-menor{color:var(--muted)}

/* ===== Portal ===== */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font:700 17px var(--f-ui);color:var(--fg);background:none;border:0;padding:0}
.brand small{font:600 12px var(--f-body);color:var(--muted);padding-left:10px;border-left:1px solid var(--line)}
.spacer{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--mint);color:#1F6872;display:grid;place-items:center;font-weight:700;font-size:13px;border:0}
.portal{max-width:1180px;margin:0 auto;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.hello p{margin-top:6px}
.searchbox{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);min-width:0;width:min(320px,100%);color:var(--muted)}
.searchbox input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--fg)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:16px}
.app-card{position:relative;display:grid;grid-template-columns:48px 1fr;gap:4px 14px;align-items:start;text-align:left;padding:18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.app-card:hover:not([disabled]){border-color:var(--blue);transform:translateY(-1px)}
.app-card[disabled]{opacity:.62;cursor:not-allowed;box-shadow:none}
.app-ico{grid-row:span 3;width:48px;height:48px;border-radius:10px;display:grid;place-items:center;background:var(--tint);color:var(--teal)}
.app-ico svg{width:24px;height:24px}
.app-card .name{font:700 15px var(--f-ui)}
.app-card .desc{color:var(--muted);font-size:13px}
.app-card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line-2);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--cta)}
.switch input:checked::after{left:16px}
.info-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:10px;align-content:start}
.panel ul{margin:0;padding-left:18px;display:grid;gap:4px}
.linkbtn{background:none;border:0;padding:0;color:var(--cta);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.linkbtn:hover{text-decoration:underline}

/* Menús emergentes */
.pop{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:6px;min-width:220px}
.pop .item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:6px;border:0;background:none}
.pop .item:hover{background:var(--surface-2)}
.pop .item.on{background:var(--tint);color:var(--teal);font-weight:600}
.pop .label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.waffle{width:min(340px,calc(100vw - 32px));padding:12px}
.waffle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.waffle-grid button{display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:8px;border:0;background:none;font:600 12px/1.2 var(--f-ui);text-align:center}
.waffle-grid button:hover:not([disabled]){background:var(--surface-2)}
.waffle-grid button[disabled]{opacity:.4;cursor:not-allowed}
.waffle-grid button.on{background:var(--tint)}
.waffle-grid .app-ico{width:40px;height:40px;grid-row:auto}
.anchor{position:relative}

/* ===== App shell ===== */
.shell{display:grid;grid-template-columns:auto 1fr;min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;width:250px;background:var(--nav);color:var(--nav-fg);font-family:var(--f-ui);display:flex;flex-direction:column;padding:16px 12px;gap:8px;overflow-y:auto;transition:width .18s}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 14px}
.side-head b{font-size:16px;font-weight:700;line-height:1.2}
.side-head .collapse{background:none;border:0;color:var(--nav-accent);padding:4px;border-radius:6px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:5px;border:0;background:none;color:var(--nav-fg);font:700 14px var(--f-ui);text-align:left}
.nav-item:hover{background:rgba(255,255,255,.07)}
.nav-item.on{background:var(--nav-active);color:var(--nav-active-fg)}
.nav-item .lbl{flex:1;min-width:0}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:var(--pend);flex:none}
body.no-annot .nav-item .dot{display:none}
.nav-group{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:14px 10px 4px}
.side-foot{margin-top:auto;display:grid;gap:4px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.side.mini{width:72px}
.side.mini .lbl,.side.mini .side-head b,.side.mini .nav-group,.side.mini .dot{display:none}
.side.mini .side-head{justify-content:center}
.side.mini .nav-item{justify-content:center}
.main{min-width:0;display:flex;flex-direction:column}
.apphead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:60px;display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:12px}
.apphead .appname{font:700 15px var(--f-ui);display:flex;align-items:center;gap:8px;min-width:0}
.apphead .appname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;color:var(--cta);font-weight:600}
.content{padding-block:24px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start;min-width:0}
.content-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.content-head .t{display:grid;gap:4px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* Tabla (componente Table del DS) */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;text-align:left;color:var(--muted);font-size:12px;background:var(--surface-2);padding:11px 14px;white-space:nowrap;border-bottom:1px solid var(--line)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.notes td{white-space:normal}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--tint)}
tbody tr.sel td{background:var(--info-bg)}
tr.archived td{color:var(--faint)}
td.chk,th.chk{width:40px;padding-right:0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--cta);margin:0;cursor:pointer}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:8px;background:var(--info-bg);font-size:13px}

/* Formulario */
.form-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.statusbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pipeline{display:flex;flex-wrap:wrap;gap:0;font-size:12px;font-weight:600}
.pipeline span{padding:6px 14px 6px 18px;background:var(--surface-2);color:var(--muted);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%)}
.pipeline span:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);padding-left:14px}
.pipeline span.on{background:var(--cta);color:var(--on-cta)}
.sheet-wrap{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1280px){.sheet-wrap{grid-template-columns:minmax(0,1fr) 360px}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:22px;min-width:0}
.sheet-title{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px 24px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;align-items:start;align-content:start;min-width:0}
.dialog td{white-space:nowrap}
.field>label,.field>.flabel{font-weight:600;font-size:13px;color:var(--fg)}
.field.req>.flabel>label::after{content:" *";color:var(--crit)}
.flabel{display:flex;align-items:center}
.flabel label{font-weight:600;font-size:13px}
.field.full{grid-column:1/-1}
.ctl{width:100%;min-width:0;height:38px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:0 10px}
textarea.ctl{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
.ctl:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.ctl[disabled]{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.field.err .ctl,.field.err .tags{border-color:var(--crit);background:var(--crit-bg)}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.field .errmsg{font-size:12px;color:var(--crit);margin-top:4px}
.cb{display:inline-flex;align-items:center;gap:8px;height:38px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:38px;border:1px solid var(--line-2);border-radius:6px;padding:4px 6px;background:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--tint);color:var(--teal);font-size:12px;font-weight:600;padding:3px 4px 3px 9px;border-radius:99px}
.chip button{border:0;background:none;color:inherit;padding:0 2px;line-height:1;display:inline-flex}
.tags select{border:0;background:none;height:28px;min-width:120px;flex:1;color:var(--muted)}
.row-inline{display:flex;gap:6px;align-items:center}
.row-inline .ctl{flex:1}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px}
.combo-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.combo-list button:hover{background:var(--surface-2)}
.combo-list .create{color:var(--cta);font-weight:600}
.divider{height:1px;background:var(--line)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{color:var(--teal);border-bottom-color:var(--cta)}
.count{font-size:11px;background:var(--surface-2);color:var(--muted);padding:1px 7px;border-radius:99px}
.addline{border:0;background:none;color:var(--cta);font-weight:600;padding:10px 14px;display:inline-flex;gap:6px;align-items:center}
.rowact{display:flex;gap:2px;justify-content:flex-end}
.rowact button{width:30px;height:30px;border:0;background:none;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.rowact button:hover{background:var(--surface-2);color:var(--fg)}
.readonly-note{font-size:12px;color:var(--muted)}

/* Chatter (historial de cambios) */
.chatter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;align-content:start;min-width:0}
@media (min-width:1280px){.chatter{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow-y:auto}}
.chat-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chat-actions .seg{display:flex;gap:4px;flex-wrap:wrap}
.chat-actions .seg button{height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13px}
.chat-actions .seg button.on{background:var(--cta);border-color:var(--cta);color:var(--on-cta)}
.composer{display:grid;gap:8px}

.catrow,.frow2{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow.off .ct b{color:var(--muted)}
.ct{display:grid;gap:2px;min-width:0;flex:1}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.ftype,.kind{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.ftype{background:var(--tint);color:var(--teal)}
.kind.cus{background:var(--pend-bg);color:var(--pend)}.kind.req{background:var(--crit-bg);color:var(--crit)}
.refdate{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;background:var(--surface-2);border-radius:8px}
.secbox{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sec-h{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.sec-name{height:32px;font-weight:700;flex:1;min-width:0;background:transparent;border-color:transparent}
.sec-name:hover{border-color:var(--line-2)}
.frow2:last-child{border-bottom:0}
.frow2.missing{background:var(--crit-bg)}
.ctl.mini{height:32px;width:auto;max-width:180px;font-size:12.5px;padding:0 8px}
.lockic{width:30px;height:30px;display:grid;place-items:center;color:var(--muted)}
.rangebox{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.rangebox.bad{border-color:var(--crit)}
.rg{display:grid;grid-template-columns:minmax(160px,2fr) repeat(3,minmax(100px,1fr)) auto;gap:10px;align-items:end}
@media (max-width:760px){.rg{grid-template-columns:repeat(2,minmax(0,1fr))}.rg .field:first-child{grid-column:1/-1}}
.rg-act{display:flex;gap:4px}
.rangebox .errmsg{display:flex;gap:6px;align-items:center}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--crit-bg);color:var(--crit);font-size:13px}
.confirm span{flex:1}
table.matrix td,table.matrix th{white-space:normal;vertical-align:middle}
table.matrix th:not(:first-child),table.matrix td:not(:first-child){min-width:150px}
table.matrix td:first-child{min-width:220px}
.secrow td{background:var(--surface-2);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 14px}
tr.missing td{background:var(--crit-bg)}
.mtot{display:block;margin-top:2px}
.cellk{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px}
.cellk.hidden{background:var(--surface-2);color:var(--muted)}.cellk.optional{background:var(--info-bg);color:var(--cyan)}.cellk.required{background:var(--ok-bg);color:var(--ok)}
.ctl.cell.optional{background:var(--info-bg);color:var(--cyan);border-color:transparent;font-weight:600}
.ctl.cell.required{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:600}
.ctl.cell.hidden{color:var(--muted)}
.form-stack{display:grid;gap:18px}
.form-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px}
.flabel{gap:8px;justify-content:space-between}
.flabel .opt{font-size:12px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:4px 18px}
.check-full{height:auto;align-items:flex-start;padding:4px 0}
.check-full input{margin-top:2px}
.reqmark{color:var(--crit)}
.field.err .seg2,.field.err .checks{outline:1px solid var(--crit);outline-offset:3px;border-radius:8px}
.seg2 button+button{border-left:1px solid var(--line-2)}
.field>.seg2{justify-self:start;max-width:100%}
.state .big.neutral{background:var(--tint);color:var(--teal)}
.login-err>span,.login-ok>span{flex:1}
.login-err{align-items:center;flex-wrap:wrap}

.sim{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.sim-phone{flex:0 1 380px;display:flex;justify-content:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:900px){.sim-phone{position:static;flex-basis:100%}}
.sim-side{flex:1 1 420px;min-width:0;display:grid;gap:16px}
.phone{width:min(370px,100%);height:760px;background:#0E1A22;border-radius:44px;padding:12px;box-shadow:0 24px 60px -24px rgba(7,47,62,.55)}
.phone-in{position:relative;height:100%;border-radius:34px;overflow:hidden;background:#F4F6F8;color:#1F2937;display:flex;flex-direction:column;font-family:var(--f-body);color-scheme:light;
 --surface:#FFFFFF;--surface-2:#F2F4F6;--line:#E6E9EC;--line-2:#D5DADF;--fg:#1F2937;--muted:#6B7280;--cta:#1E8E9E;--on-cta:#FFFFFF;--tint:#E5F4F6;--teal:#1F6872;--cyan:#098392;--crit:#C9302B;--crit-bg:#FCE8E7;--ok:#00A779;--ok-bg:#E3F7EF;--info-bg:#E8F6F8;--blue:#1E8E9E}
.m-top{display:flex;align-items:center;justify-content:space-between;padding:26px 14px 12px;background:#FFFFFF;border-bottom:1px solid #E6E9EC}
.m-top b{font:700 17px var(--f-ui)}
.m-ib{width:40px;height:40px;border:0;background:none;color:#1E8E9E;display:grid;place-items:center;border-radius:10px}
.m-ib.spinning svg{animation:sp .8s linear infinite}
.m-body{flex:1;overflow-y:auto;padding:14px;display:grid;gap:14px;align-content:start}
.m-hello{display:flex;justify-content:space-between;gap:10px;padding:16px;border-radius:14px;background:linear-gradient(120deg,#FFFFFF,#D9EEF2);box-shadow:0 2px 8px rgba(7,47,62,.08)}
.m-hello span{font-weight:600;font-size:14px}.m-hello b{display:block;font:700 21px var(--f-ui);margin:2px 0 4px}.m-hello p{font-size:12.5px;font-weight:600;line-height:1.35}
.m-wave{width:56px;height:56px;flex:none;border-radius:50%;background:#1E8E9E;color:#FFFFFF;display:grid;place-items:center;align-self:center}.m-wave svg{width:28px;height:28px}
.m-stats{display:grid;grid-template-columns:repeat(3,1fr);background:#FFFFFF;border-radius:14px;padding:14px 4px;box-shadow:0 2px 8px rgba(7,47,62,.08)}
.m-stat{display:grid;justify-items:center;gap:4px;font-size:13px;font-weight:700}.m-stat+.m-stat{border-left:1px solid #E6E9EC}
.m-si{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.m-stat b{font-size:30px;line-height:1.1}.m-stat i{width:40px;height:4px;border-radius:2px;margin-top:4px}
.m-stat.teal .m-si{background:#DDF0F3;color:#1E8E9E}.m-stat.teal b{color:#1E8E9E}.m-stat.teal i{background:#1E8E9E}
.m-stat.amber .m-si{background:#FDF3D5;color:#C88A00}.m-stat.amber b{color:#B07A00}.m-stat.amber i{background:#F2B705}
.m-stat.coral .m-si{background:#FDE5E2;color:#E0574A}.m-stat.coral b{color:#D04B3F}.m-stat.coral i{background:#EC6A5C}
.m-card{background:#FFFFFF;border-radius:14px;padding:16px;display:grid;gap:12px;box-shadow:0 2px 8px rgba(7,47,62,.08)}
.m-ch{display:flex;gap:12px;align-items:center}.m-ch b{display:block;font-size:14.5px}.m-ch span{font-size:13px}
.m-plus{width:44px;height:44px;flex:none;border-radius:50%;background:#DDF0F3;color:#1E8E9E;display:grid;place-items:center}
.m-ctl{width:100%;height:50px;border:1.5px solid #D5DADF;border-radius:10px;background:#F7F8FA;padding:0 12px;font-size:15px;color:#1F2937}
.m-ctl:disabled{opacity:.5}
.m-num{position:relative}.m-num>span{position:absolute;left:12px;top:15px;color:#9AA1A9}.m-num .m-ctl{padding-left:38px}
.m-btn{width:100%;height:50px;border:0;border-radius:10px;background:#1E8E9E;color:#FFFFFF;font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;justify-content:center}
.m-btn:disabled{background:#8CC7CF;cursor:not-allowed}
.m-foot{text-align:center;font-size:12px;color:#6B7280}
.m-alert{display:flex;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px}.m-alert>svg{flex:none;margin-top:2px}.m-alert div{display:grid;gap:3px}
.m-alert.crit{background:#FCE8E7;color:#9E2420}.m-alert.warn{background:#FFF2DC;color:#7A4A00}
.m-link{justify-self:start;border:0;background:none;padding:0;color:inherit;font-weight:700;text-decoration:underline}
.m-toast{position:absolute;left:14px;right:14px;top:86px;z-index:5;padding:9px 12px;border-radius:10px;font-size:12.5px;font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.m-toast.ok{background:#072F3E;color:#FFFFFF}.m-toast.crit{background:#8E211D;color:#FFFFFF}

.m-ver{justify-self:start;margin-top:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#DDF0F3;color:#1F6872}
.m-sec{background:#FFFFFF;border-radius:12px;padding:14px;display:grid;gap:12px}
.m-sec h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6B7280}
.m-sec .ctl{height:44px;font-size:15px}.m-sec textarea.ctl{height:auto}
.m-note{display:flex;gap:8px;align-items:center;font-size:13px;padding:10px 12px;border-radius:10px;background:#FFFFFF;color:#4B5563}.m-note.ok{background:#E3F7EF;color:#00754F}
.m-done{justify-items:center;text-align:center;align-content:center;padding:28px}.m-done p{font-size:14px;color:#4B5563}
.m-big{width:72px;height:72px;border-radius:50%;display:grid;place-items:center}.m-big svg{width:34px;height:34px}.m-big.teal{background:#DDF0F3;color:#1E8E9E}.m-big.coral{background:#FDE5E2;color:#D04B3F}
.evlog{gap:8px;max-height:300px;overflow-y:auto}
.ev{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:12.5px;padding:6px 8px;border-radius:6px;border-left:3px solid var(--ok);background:var(--surface-2)}
.ev.warn{border-left-color:var(--warn)}.ev.crit{border-left-color:var(--crit)}.ev span:first-child{color:var(--muted)}

/* ---- Mapa de calor ---- */
#heat-cv{position:absolute;left:0;top:0;z-index:55;pointer-events:none;mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #heat-cv{mix-blend-mode:screen}}
:root[data-theme="dark"] #heat-cv{mix-blend-mode:screen}
#heat-ui{position:fixed;z-index:75;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:start}
.heat-fab{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:600;font-size:13px;box-shadow:0 6px 18px rgba(7,47,62,.18)}
.heat-fab.on{background:#072F3E;color:#FFFFFF;border-color:#072F3E}
.heat-panel{order:-1;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.2);padding:12px;display:grid;gap:10px}
.hp-h{display:flex;align-items:center;justify-content:space-between}
.hp-sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;cursor:pointer}
.sw.on:checked{background:var(--cta)}
.heat-panel .kvs{padding:0}
.hp-list{display:grid;gap:4px;font-size:12.5px;max-height:150px;overflow-y:auto}.hp-list div{display:flex;justify-content:space-between;gap:10px}
.hp-scale{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}.hp-scale i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,rgb(30,120,220),rgb(30,220,180),rgb(255,220,20),rgb(255,40,20))}

function submitLogin(){
 const L=S.login;const e=L.email.trim().toLowerCase();
 if(L.step==='recover'){
  if(!e){L.err='Escribe tu correo electrónico.';render();return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){L.err='Revisa el formato del correo (ejemplo: nombre@empresa.com).';render();return}
  L.err='';L.step='sent';render();return;
 }
 if(!e){L.err='Escribe tu correo electrónico.';render();return}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){L.err='Revisa el formato del correo (ejemplo: nombre@empresa.com).';render();return}
 if(!L.pass){L.err='Escribe tu contraseña.';render();return}
 const acc=ACCOUNTS.find(a=>a.email===e);
 if(!acc||L.pass!==DEMO_PASS){L.err='Correo o contraseña incorrectos. Verifica los datos o usa «¿Olvidaste tu contraseña?».';L.pass='';render();return}
 doLogin(acc);
}
/* Tooltip */
let tipEl=null;
function showTip(t){hideTip();const txt=t.getAttribute('data-tip');if(!txt)return;tipEl=document.createElement('div');tipEl.className='tipbox';tipEl.setAttribute('role','tooltip');tipEl.textContent=txt;document.body.appendChild(tipEl);const r=t.getBoundingClientRect();const w=tipEl.offsetWidth,h=tipEl.offsetHeight;let y=r.bottom+8;if(y+h>innerHeight-8)y=r.top-h-8;let x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8);tipEl.style.top=y+'px';tipEl.style.left=x+'px'}
function hideTip(){if(tipEl){tipEl.remove();tipEl=null}}
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(t)showTip(t);else hideTip()});
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t)});
document.addEventListener('focusout',hideTip);
addEventListener('scroll',hideTip,{passive:true});

}

function widgetOf(f){
 if(f.type==='char')return /email/.test(f.name)?'email':/phone|mobile/.test(f.name)?'tel':'text';
 if(f.type==='text'||f.type==='html')return 'textarea';

}

  case 'textarea':return `<textarea class="ctl" id="${id}" ${d}>${esc(v||'')}</textarea>`;
  case 'number':return `<input class="ctl" type="number" inputmode="decimal" step="${f.type==='float'?'0.1':'1'}" id="${id}" ${d} value="${esc(v||'')}">`;
  case 'boolean':return `<label class="cb check-full"><input type="checkbox" id="${id}" ${d} ${v?'checked':''}><span>${esc(f.string)}${f.rule==='required'?' <span class="reqmark">*</span>':''}</span></label>`;
  case 'radio':return `<div class="seg2" role="radiogroup" aria-labelledby="l-${id}" style="flex-wrap:wrap">${f.selection.map(([k,l],i)=>`<button type="button" role="radio" ${i?'':`id="${id}"`} aria-checked="${v===k}" class="${v===k?'on':''}" data-act="pick" ${d} data-opt="${k}">${esc(l)}</button>`).join('')}</div>`;
  case 'select':return `<select class="ctl" id="${id}" ${d}><option value="">Selecciona…</option>${f.selection.map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  case 'many2one':return `<select class="ctl" id="${id}" ${d}><option value="">Selecciona…</option>${(REL[f.relation]||[]).map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  case 'many2many':{const cur=v||[];return `<div class="checks" role="group" aria-labelledby="l-${id}">${(REL[f.relation]||[]).map((o,i)=>`<label class="cb"><input type="checkbox" ${i?'':`id="${id}"`} data-store="${store}" data-multi="${f.name}" value="${esc(o)}" ${cur.includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`}
  case 'datetime':return `<input class="ctl" type="datetime-local" id="${id}" ${d} value="${esc(v||'')}">`;
  default:return `<input class="ctl" type="${w}" id="${id}" ${d} value="${esc(v||'')}" ${w==='tel'?'inputmode="tel"':''}>`;
 }
}

   <div class="field"><div class="flabel"><label for="${store}-ref">Fecha de referencia</label></div>${opts.refEditable?`<input class="ctl" type="date" id="${store}-ref" data-store="${store}" data-ref="1" value="${esc(ref)}">`:`<div class="ro">${fmtD(ref)}</div>`}<div class="hint">${cfg&&cfg.refDate.mode==='fixed'?'Fecha fija definida en la configuración del estudio.':'Fecha del registro (hoy).'}</div></div>
   ${R.age&&!R.age.neg?`<div class="field full"><div class="reveal">${ic('info','sm')}<span>Edad a la fecha de referencia: <b>${ageTxt(R.age)}</b> · ${R.age.years} años · ${R.age.months} meses · ${R.age.days} días</span></div></div>`:''}
 </div></div></section>`;
 let body='';
 if(R.status==='nocfg')body=stateBox('alert','No hay un formulario configurado para este estudio','Un administrador debe definir los campos y al menos un rango de edad en Configuración de formularios.');
 else if(R.status==='noage')body=stateBox('calendar','Escribe la fecha de nacimiento','Con la edad se identifica el rango y se muestran los campos que corresponden.',true);
 else if(R.status==='neg')body=stateBox('alert','La fecha de nacimiento es posterior a la fecha de referencia','Revisa las dos fechas.');
 else if(R.status==='norange')body=stateBox('alert',`No hay un formulario configurado para ${ageTxt(R.age)}`,`Este estudio tiene formularios para: ${cfg.ranges.map(r=>rangeTxt(r)).join(' · ')}. No se muestran campos para esta edad.`);
 else body=R.secs.map(s=>`<section class="card"><div class="card-h"><h2>${esc(s.name)}</h2><span class="small muted num">${s.fields.length} campo${s.fields.length>1?'s':''}</span></div><div class="card-b"><div class="grid2">${s.fields.map(f=>fieldHTML(f,st,store)).join('')}</div></div></section>`).join('')
  +(opts.submit?`<div class="form-actions"><button type="button" class="btn btn-tertiary" data-act="capclear">Limpiar</button><button type="submit" class="btn btn-primary" ${st.sending?'disabled':''}>${st.sending?'<span class="spin"></span> Enviando a Odoo…':`${ic('check','sm')}Guardar en Odoo`}</button></div>`:'');
 let prog='';

  prog=`<div class="req-progress ${pct===100?'done':''}" data-prog="${store}"><span><b class="num">${done}</b> de <b class="num">${req.length}</b> campos obligatorios</span><span class="bar"><i style="width:${pct}%"></i></span></div>`}
 return `<div class="form-stack">${ageBox}${prog}${body}</div>`;

function appSync(){
 const A=S.app;if(A.syncing)return;A.syncing=true;render();
 API.call(()=>clone(CONFIGS),800).then(c=>{
  const changed=Object.keys(c).filter(k=>!A.cache[k]||A.cache[k].version!==c[k].version);
  A.cache=c;A.syncing=false;A.syncAt=nowHM();
  appLog('ok',changed.length?`Sincronizó ${changed.length} formulario${changed.length>1?'s':''} actualizado${changed.length>1?'s':''}: ${changed.map(k=>`${proj(+k).name.split(' · ')[0]} v${c[k].version}`).join(', ')}.`:'Sincronizó: no había cambios.');
  if(A.block&&A.block.sync)A.block=null;
  A.msg={k:'ok',m:changed.length?'Formularios actualizados.':'Todo está al día.'};render();
 }).catch(()=>{A.syncing=false;appLog('crit','No se pudo sincronizar. La app sigue con la última configuración descargada.');A.msg={k:'crit',m:`Sin conexión. Se usa la configuración descargada a las ${A.syncAt}.`};render()});
}
function appSearch(){
 const A=S.app,chk=appCheck(+A.pid);const code=proj(+A.pid).name.split(' · ')[0];
 if(!chk.ok){A.block=chk;appLog(chk.k,`${code}: ${chk.t}.`);render();return}
 A.block=null;
 const ex=EXISTING[A.num.trim()];
 if(ex){A.counts.d++;A.result={dup:true,...ex};A.screen='result';appLog('warn',`${code}: documento ${A.num} ya existe (crm.lead #${ex.lead}). Se marcó como duplicada.`);render();return}
 if(chk.miss.length)appLog('warn',`${code}: se omitieron campos no disponibles en Odoo (${chk.miss.map(f=>f.name).join(', ')}).`);
 appLog('ok',`${code}: se validó la configuración v${A.cache[A.pid].version} y se abrió el formulario.`);
 A.ans={x_studio_tipo_documento:A.tipo,x_studio_numero_documento:A.num};A.err={};A.screen='form';render();
}
function appSubmit(){
 const A=S.app,cfg=A.cache[A.pid];
 const R=buildForm(cfg,S.api.fields,A.ans[BIRTH],refOf(cfg));
 if(R.status!=='ok'){A.err={[BIRTH]:R.status==='noage'?'Escribe la fecha de nacimiento.':R.status==='neg'?'La fecha no puede ser futura.':''};render();return}
 const fs=R.secs.flatMap(s=>s.fields).filter(f=>!DOC_FIELDS.includes(f.name));const err={};
 fs.forEach(f=>{const m=validate(f,A.ans[f.name]);if(m)err[f.name]=m});A.err=err;
 if(Object.keys(err).length){render();const el=document.getElementById('app-'+Object.keys(err)[0]);el&&el.scrollIntoView({block:'center'});return}
 A.sending=true;render();
 API.createLead({}).then(r=>{A.sending=false;A.counts.n++;A.result={dup:false,lead:r.id,name:A.ans.contact_name||'el candidato',range:R.range.name||rangeTxt(R.range)};A.screen='result';
  appLog('ok',`${proj(+A.pid).name.split(' · ')[0]}: se creó crm.lead #${r.id} con la configuración v${cfg.version} (rango ${rangeTxt(R.range)}).`);render()})
 .catch(()=>{A.sending=false;A.msg={k:'crit',m:'No se pudo enviar a Odoo. Tus datos siguen en el formulario.'};render()});
}

/* ---------- Pantallas de la app ---------- */
function PhoneHome(){
 const A=S.app,ps=appProjects(),sites=A.pid?SITES[A.pid]||[]:[],ready=A.pid&&A.site&&A.tipo&&A.num.trim().length>=5;
 const tipos=ODOO_FIELDS.x_studio_tipo_documento.selection;
 return `<div class="m-body" id="phone-scroll">
  <div class="m-hello"><div><span>Hola,</span><b>${esc(S.acc.first||S.acc.name)}</b><p>Consulta el estado de tus oportunidades y registra nuevos candidatos fácilmente.</p></div><span class="m-wave" aria-hidden="true">${ic('wave')}</span></div>
  <div class="m-stats">${[['n','Nuevas','users','teal'],['a','Actualizadas','pencil','amber'],['d','Duplicadas','dup','coral']].map(([k,l,i,c])=>`<div class="m-stat ${c}"><span class="m-si">${ic(i)}</span><b class="num">${A.counts[k]}</b><span>${l}</span><i></i></div>`).join('')}</div>
  <div class="m-card">
   <div class="m-ch"><span class="m-plus">${ic('plus')}</span><div><b>Registra una nueva oportunidad</b><span>Ingresa los datos para continuar</span></div></div>
   <label class="sr" for="m-proj">Proyecto</label><select class="m-ctl" id="m-proj" data-act="appsel" data-k="pid"><option value="">Seleccione un proyecto</option>${ps.map(p=>`<option value="${p.id}" ${+A.pid===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
   <label class="sr" for="m-site">Sitio</label><select class="m-ctl" id="m-site" data-act="appsel" data-k="site" ${A.pid?'':'disabled'}><option value="">Seleccione un sitio</option>${sites.map(s=>`<option ${A.site===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
   <label class="sr" for="m-tipo">Tipo de identificación</label><select class="m-ctl" id="m-tipo" data-act="appsel" data-k="tipo" ${A.site?'':'disabled'}><option value="">Seleccione un tipo de identificación</option>${tipos.map(([k,l])=>`<option value="${k}" ${A.tipo===k?'selected':''}>${esc(l)}</option>`).join('')}</select>
   <div class="m-num"><span>${ic('user','sm')}</span><label class="sr" for="m-num">Número de identificación</label><input class="m-ctl" id="m-num" data-act="appnum" inputmode="numeric" placeholder="Número de identificación" value="${esc(A.num)}" ${A.tipo?'':'disabled'}></div>
   ${A.block?`<div class="m-alert ${A.block.k}" role="alert">${ic('alert','sm')}<div><b>${esc(A.block.t)}</b><span>${esc(A.block.m)}</span>${A.block.sync?`<button class="m-link" data-act="appsync">Sincronizar ahora</button>`:''}</div></div>`:''}
   <button class="m-btn" data-act="appsearch" ${ready?'':'disabled'}>${ic('search','sm')} Buscar</button>
  </div>
  <p class="m-foot">Formularios descargados a las ${esc(A.syncAt)}</p>
 </div>`;
}
function PhoneForm(){
 const A=S.app,cfg=A.cache[A.pid],p=proj(+A.pid),ref=refOf(cfg);const R=buildForm(cfg,S.api.fields,A.ans[BIRTH],ref);
 const tipoL=(ODOO_FIELDS.x_studio_tipo_documento.selection.find(x=>x[0]===A.tipo)||[])[1];
 let body='';
 if(R.status==='noage')body=`<div class="m-note">${ic('calendar','sm')} Escribe la fecha de nacimiento para ver los datos que pide este proyecto.</div>`;
 else if(R.status==='neg')body=`<div class="m-alert crit">${ic('alert','sm')}<div><b>Fecha no válida</b><span>La fecha de nacimiento es posterior a la fecha de referencia.</span></div></div>`;
 else if(R.status==='norange')body=`<div class="m-alert crit">${ic('alert','sm')}<div><b>Sin formulario para ${ageTxt(R.age)}</b><span>Este proyecto recibe candidatos de: ${cfg.ranges.map(rangeTxt).join(' · ')}. No se puede registrar esta edad.</span></div></div>`;
 else if(R.status==='ok')body=R.secs.map(s=>{const fs=s.fields.filter(f=>!DOC_FIELDS.includes(f.name));return fs.length?`<div class="m-sec"><h4>${esc(s.name)}</h4>${fs.map(f=>fieldHTML(f,A,'app')).join('')}</div>`:''}).join('')+
  `<button class="m-btn" data-act="appsubmit" ${A.sending?'disabled':''}>${A.sending?'<span class="spin"></span> Enviando…':'Registrar candidato'}</button>`;
 return `<div class="m-body" id="phone-scroll">
  <div class="m-ctx"><b>${esc(p.name.split(' · ')[0])}</b><span>${esc(A.site)} · ${esc(tipoL)} ${esc(A.num)}</span><span class="m-ver">Formulario v${cfg.version}</span></div>
  <div class="m-sec"><h4>Edad</h4>
   <div class="field req ${A.err[BIRTH]?'err':''}"><div class="flabel"><label for="app-${BIRTH}">Fecha de nacimiento</label></div><input class="ctl" type="date" id="app-${BIRTH}" data-store="app" data-fld="${BIRTH}" value="${esc(A.ans[BIRTH]||'')}" max="${ref}">${A.err[BIRTH]?`<div class="errmsg">${esc(A.err[BIRTH])}</div>`:''}</div>
   ${R.age&&!R.age.neg?`<div class="m-note ok">${ic('check','sm')} ${ageTxt(R.age)}${R.range?` · Rango «${esc(R.range.name||rangeTxt(R.range))}»`:''}</div>`:''}
  </div>${body}</div>`;
}
function PhoneResult(){
 const A=S.app,r=A.result;
 return `<div class="m-body m-done" id="phone-scroll"><span class="m-big ${r.dup?'coral':'teal'}">${ic(r.dup?'dup':'check')}</span>
  <h3>${r.dup?'Este candidato ya está registrado':'Candidato registrado'}</h3>
  <p>${r.dup?`El documento ya tiene la oportunidad <b>#${r.lead}</b> (${esc(r.name)}). La sumamos a tus duplicadas.`:`Se creó la oportunidad <b>#${r.lead}</b> para ${esc(r.name)} · rango ${esc(r.range)}.`}</p>
  <button class="m-btn" data-act="apphome">Volver al inicio</button></div>`;
}
function Phone(){
 const A=S.app,sc=A.screen;
 return `<div class="phone"><div class="phone-in">
  <div class="m-top">${sc==='home'?`<button class="m-ib" aria-label="Menú">${ic('menu')}</button>`:`<button class="m-ib" data-act="apphome" aria-label="Volver">${ic('left')}</button>`}<b>${sc==='form'?'Nueva oportunidad':'TrialPal Recruitment'}</b><button class="m-ib ${A.syncing?'spinning':''}" data-act="appsync" aria-label="Sincronizar formularios">${ic('refresh')}</button></div>
  ${A.msg?`<div class="m-toast ${A.msg.k}" role="status">${esc(A.msg.m)}</div>`:''}
  ${sc==='form'?PhoneForm():sc==='result'?PhoneResult():PhoneHome()}
 </div></div>`;

function AppSim(){
 const top=`<div class="content-head"><div class="t"><div class="crumbs"><button data-act="nav" data-sub="home">CRM</button><span>/</span><span>Simulador app móvil</span></div><h1>Simulador app móvil</h1><p class="muted">Así consume la app de referidores las configuraciones publicadas: las descarga al sincronizar y las valida antes de mostrar el formulario.</p></div></div>`;
 const api=ApiState();if(!S.api.projects)return top+api;
 const A=S.app;const rows=Object.keys({...CONFIGS,...A.cache}).map(Number).map(pid=>{const s=CONFIGS[pid],c=A.cache[pid];const st=!c?'Sin descargar':s&&c.version<s.version?'Desactualizada':'Al día';return {pid,s,c,st}});
 return top+api+`<div class="sim">
  <div class="sim-phone">${Phone()}</div>
  <div class="sim-side">
   <section class="card"><div class="card-h"><div><h2>Sincronización</h2><p class="small muted">Última sincronización de la app: ${esc(A.syncAt)}</p></div><button class="btn btn-secondary btn-sm" data-act="appsync">${ic('refresh','sm')}Sincronizar app</button></div>
    <div class="tablewrap" style="border:0;border-radius:0"><table><thead><tr><th>Proyecto</th><th>Publicada</th><th>En la app</th><th>Estado</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(proj(r.pid)?proj(r.pid).name.split(' · ')[0]:r.pid)}</td><td class="num">${r.s?'v'+r.s.version:'—'}</td><td class="num">${r.c?'v'+r.c.version:'—'}</td><td><span class="pill ${r.st==='Al día'?'st-cerrada':r.st==='Desactualizada'?'st-proceso':'st-off'}">${r.st}</span></td></tr>`).join('')}
    </tbody></table></div>
    <div class="card-b"><p class="small muted">Para probar: cambia y guarda un formulario en Configuración de formularios. La app sigue con la versión anterior hasta sincronizar y no deja registrar en ese proyecto mientras esté desactualizada.</p></div></section>
   <section class="card"><div class="card-h"><h2>Validaciones de la app</h2></div><div class="card-b"><ol class="steps">
    <li>Solo lista proyectos en estado «En reclutamiento».</li>
    <li>Al buscar, revisa que el proyecto tenga un formulario publicado y que la copia de la app sea la versión vigente.</li>
    <li>Si el documento ya existe en Odoo, lo marca como duplicado y no abre el formulario.</li>
    <li>Con la fecha de nacimiento calcula la edad y elige el rango; si no hay rango, no deja registrar.</li>
    <li>Muestra solo los campos del rango, omite los que ya no existen en Odoo y valida los obligatorios.</li>
    <li>Sin conexión, sigue con la última configuración descargada.</li>
   </ol></div></section>
   <section class="card"><div class="card-h"><h2>Registro de eventos</h2></div><div class="card-b evlog">${A.log.map(l=>`<div class="ev ${l.k}"><span class="num">${esc(l.t)}</span><span>${esc(l.m)}</span></div>`).join('')}</div></section>
  </div></div>`;
}

/* ---------- Eventos del simulador ---------- */
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-act]');if(!t||t.disabled)return;const A=S.app;
 switch(t.dataset.act){
  case 'appsync':A.msg=null;appSync();return;
  case 'appsearch':A.msg=null;appSearch();return;
  case 'appsubmit':A.msg=null;appSubmit();return;
  case 'apphome':A.screen='home';A.msg=null;if(A.result){A.pid='';A.site='';A.tipo='';A.num=''}A.result=null;A.ans={};A.err={};render();return;
 }
});
document.addEventListener('change',ev=>{
 const t=ev.target;if(t.dataset.act!=='appsel')return;const A=S.app,k=t.dataset.k;
 A[k]=t.value;A.block=null;A.msg=null;
 if(k==='pid'){A.site='';A.tipo='';A.num=''}if(k==='site'){A.tipo='';A.num=''}
 render();
});
document.addEventListener('input',ev=>{
 const t=ev.target;if(t.dataset.act!=='appnum')return;S.app.num=t.value.replace(/[^0-9A-Za-z]/g,'');S.app.block=null;render();
});


/* =====================================================================
   Mapa de calor de clics (propio del prototipo)
   Guarda solo: pantalla, ancho de vista (escritorio / móvil) y posición del clic.
   Nunca guarda lo que se escribe.
   ===================================================================== */
const HEAT={db:null,ready:false,on:false,open:false,rows:[],buf:{},unsub:null,err:''};
const heatScreen=()=>{
 if(S.view==='login')return 'login';
 if(S.sub==='cfg')return S.cfg.pid?'cfg/'+S.cfg.tab:'cfg/sin-estudio';
 if(S.sub==='app')return 'app/'+S.app.screen;
 return 'crm/inicio';
};
const SCREEN_ES={'login':'Login','crm/inicio':'CRM · Inicio','cfg/sin-estudio':'Configuración · sin estudio','cfg/fields':'Configuración · Campos','cfg/ranges':'Configuración · Rangos de edad','cfg/preview':'Configuración · Vista previa','app/home':'App móvil · Inicio','app/form':'App móvil · Formulario','app/result':'App móvil · Resultado'};
const heatBucket=()=>innerWidth>=900?'desk':'mob';
const docW=()=>document.documentElement.scrollWidth;
const docH=()=>Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);

document.addEventListener('pointerdown',e=>{
 if(e.target.closest&&e.target.closest('#heat-ui'))return;
 const k=heatScreen()+'|'+heatBucket();
 (HEAT.buf[k]=HEAT.buf[k]||[]).push([+(e.pageX/docW()).toFixed(4),Math.round(e.pageY)]);
 if(HEAT.on)heatDraw();
 if(HEAT.open)heatPanel();
},true);
function heatFlush(){
 if(!HEAT.db)return;
 const b=HEAT.buf;HEAT.buf={};
 Object.entries(b).forEach(([k,p])=>{if(!p.length)return;const [s,bk]=k.split('|');
  for(let i=0;i<p.length;i+=200)HEAT.db.collection('clicks').add({s,b:bk,p:p.slice(i,i+200),t:Date.now()}).catch(()=>{});
 });
}
setInterval(heatFlush,8000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')heatFlush()});

function heatPoints(){
 const s=heatScreen(),b=heatBucket();let pts=[];
 HEAT.rows.forEach(r=>{if(r.s===s&&r.b===b&&Array.isArray(r.p))pts=pts.concat(r.p)});
 (HEAT.buf[s+'|'+b]||[]).forEach(p=>pts.push(p));
 return pts;
}
let heatCv=null;
function heatDraw(){
 if(!HEAT.on){if(heatCv){heatCv.remove();heatCv=null}return}
 const W=docW(),H=docH();
 if(!heatCv){heatCv=document.createElement('canvas');heatCv.id='heat-cv';heatCv.setAttribute('aria-hidden','true');document.body.appendChild(heatCv)}
 const sc=Math.min(1,2400/Math.max(W,H));heatCv.width=Math.round(W*sc);heatCv.height=Math.round(H*sc);heatCv.style.width=W+'px';heatCv.style.height=H+'px';
 const c=heatCv.getContext('2d');c.clearRect(0,0,heatCv.width,heatCv.height);
 const pts=heatPoints();if(!pts.length)return;
 const r=Math.max(14,34*sc);
 pts.forEach(([x,y])=>{const px=x*W*sc,py=y*sc;const g=c.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'rgba(0,0,0,.22)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(px-r,py-r,r*2,r*2)});
 const img=c.getImageData(0,0,heatCv.width,heatCv.height),d=img.data;
 for(let i=0;i<d.length;i+=4){const a=d[i+3]/255;if(!a)continue;
  const v=Math.min(1,a*1.6);let R,G,B;
  if(v<.33){const t=v/.33;R=30;G=Math.round(120+100*t);B=Math.round(220-40*t)}
  else if(v<.66){const t=(v-.33)/.33;R=Math.round(30+225*t);G=220;B=Math.round(180-160*t)}
  else{const t=(v-.66)/.34;R=255;G=Math.round(220-180*t);B=20}
  d[i]=R;d[i+1]=G;d[i+2]=B;d[i+3]=Math.round(Math.min(.82,.25+v*.7)*255)}
 c.putImageData(img,0,0);
}
function heatPanel(){
 let ui=document.getElementById('heat-ui');
 if(!ui){ui=document.createElement('div');ui.id='heat-ui';document.body.appendChild(ui)}
 const pts=heatPoints().length,scr=heatScreen(),all=HEAT.rows.reduce((n,r)=>n+(r.p?r.p.length:0),0);
 const byScreen={};HEAT.rows.forEach(r=>{if(r.b===heatBucket())byScreen[r.s]=(byScreen[r.s]||0)+(r.p?r.p.length:0)});
 ui.innerHTML=`<button type="button" class="heat-fab ${HEAT.on?'on':''}" data-heat="toggle" aria-expanded="${HEAT.open}">${ic('target','sm')}<span>Mapa de calor</span></button>
 ${HEAT.open?`<div class="heat-panel" role="dialog" aria-label="Mapa de calor">
  <div class="hp-h"><b>Mapa de calor de clics</b><button type="button" class="btn btn-icon btn-sm" data-heat="close" aria-label="Cerrar">${ic('x','sm')}</button></div>
  <label class="hp-sw"><span>Mostrar sobre esta pantalla</span><input type="checkbox" class="sw on" data-heat="show" ${HEAT.on?'checked':''}></label>
  <div class="kvs"><span>Pantalla</span><b>${esc(SCREEN_ES[scr]||scr)}</b><span>Vista</span><b>${heatBucket()==='desk'?'Escritorio (≥ 900 px)':'Móvil / ventana angosta'}</b><span>Clics aquí</span><b class="num">${pts}</b><span>Clics guardados</span><b class="num">${all}</b></div>
  ${Object.keys(byScreen).length?`<div class="hp-list"><span class="label" style="padding:0">Clics por pantalla</span>${Object.entries(byScreen).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div><span>${esc(SCREEN_ES[k]||k)}</span><b class="num">${n}</b></div>`).join('')}</div>`:''}
  <div class="hp-scale"><span>Menos</span><i></i><span>Más</span></div>
  <p class="small muted">${HEAT.err?esc(HEAT.err):HEAT.db?'Se guardan los clics de todas las personas con acceso a este enlace. Solo la pantalla y la posición; nunca lo que se escribe.':'Esta copia no guarda clics compartidos: solo verás los de esta visita. Los mapas de calor y grabaciones de todos los usuarios están en Hotjar.'}</p>
  <p class="small muted">Cambia de pantalla en el prototipo para ver su mapa. Los clics de escritorio y de móvil se muestran por separado.</p>
 </div>`:''}`;
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-heat]');if(!b||b.tagName==='INPUT')return;
 const a=b.dataset.heat;
 if(a==='toggle'){HEAT.open=!HEAT.open;if(HEAT.open&&!HEAT.on){HEAT.on=true;heatDraw()}}
 if(a==='close')HEAT.open=false;
 heatPanel();
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.heat!=='show')return;HEAT.on=t.checked;heatDraw();heatPanel()});
addEventListener('resize',()=>{clearTimeout(heatDraw.t);heatDraw.t=setTimeout(()=>{heatDraw();heatPanel()},150)});
window.__heatAfter=()=>{if(HEAT.on)requestAnimationFrame(heatDraw);if(document.getElementById('heat-ui'))heatPanel()};

(async()=>{
 heatPanel();
 try{
  if(!window.claude||!window.claude.use)return;
  const db=await window.claude.use('db');if(!db)return;
  HEAT.db=db;
  db.collection('clicks').orderBy('t','desc').limit(800).onSnapshot(snap=>{HEAT.rows=snap.docs.map(d=>d.data()||{});HEAT.err='';if(HEAT.on)heatDraw();heatPanel()},
   err=>{HEAT.err=err&&err.code==='not_granted'?'No tienes permiso para ver los clics guardados.':'No se pudieron cargar los clics guardados.';heatPanel()});
 }catch(e){}
})();

})();
</script>
